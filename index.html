<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
      <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/charts.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/platform-icons.css">
    <link rel="stylesheet" href="css/icon-fixes.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loader-container">
            <div class="voxly-loader">
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <div class="loader-ring"></div>
                <span class="loader-text">Voxly Pro</span>
            </div>
            <p class="loading-text">Initializing Analytics...</p>
        </div>
    </div>

    <!-- Main App Container -->
    <div class="app-container" id="appContainer">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">V</div>
                    <span class="logo-text">Voxly Pro</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <span class="toggle-icon">☰</span>
                </button>
            </div>

            <div class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard" data-tooltip="Dashboard">
                    <span class="nav-icon"><span class="flat-icon icon-dashboard"></span></span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-page="realtime" data-tooltip="Real-Time Monitor">
                    <span class="nav-icon"><span class="flat-icon icon-realtime"></span></span>
                    <span class="nav-label">Real-Time Monitor</span>
                    <span class="badge pulse">Live</span>
                </a>
                <a href="#" class="nav-item" data-page="trends" data-tooltip="Trend Discovery">
                    <span class="nav-icon"><span class="flat-icon icon-trending"></span></span>
                    <span class="nav-label">Trend Discovery</span>
                </a>
                <a href="#" class="nav-item" data-page="analytics" data-tooltip="Advanced Analytics">
                    <span class="nav-icon"><span class="flat-icon icon-analytics"></span></span>
                    <span class="nav-label">Advanced Analytics</span>
                </a>
                <a href="#" class="nav-item" data-page="competitors" data-tooltip="Competitor Analysis">
                    <span class="nav-icon"><span class="flat-icon icon-competitors"></span></span>
                    <span class="nav-label">Competitor Analysis</span>
                </a>
                <a href="#" class="nav-item" data-page="influencers" data-tooltip="Influencer Hub">
                    <span class="nav-icon"><span class="flat-icon icon-users"></span></span>
                    <span class="nav-label">Influencer Hub</span>
                </a>
                <a href="#" class="nav-item" data-page="journey" data-tooltip="Customer Journey">
                    <span class="nav-icon"><span class="material-icons" style="font-size: 20px;">route</span></span>
                    <span class="nav-label">Customer Journey</span>
                </a>
                <a href="#" class="nav-item" data-page="reports" data-tooltip="Reports">
                    <span class="nav-icon"><span class="flat-icon icon-document"></span></span>
                    <span class="nav-label">Reports</span>
                </a>
                <a href="#" class="nav-item" data-page="settings" data-tooltip="Settings">
                    <span class="nav-icon"><span class="flat-icon icon-settings"></span></span>
                    <span class="nav-label">Settings</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">TP</div>
                    <div class="user-info">
                        <div class="user-name">Tushar Patil</div>
                        <div class="user-role">Marketing Manager</div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <div class="header-left">
                    <h1 class="page-title" id="pageTitle">Dashboard</h1>
                    <div class="breadcrumb">
                        <span>Home</span>
                        <span class="separator">/</span>
                        <span id="breadcrumbCurrent">Dashboard</span>
                    </div>
                </div>

                <!-- Centered Search Bar -->
                <div class="header-center">
                    <div class="search-container">
                        <input type="text" id="globalSearch" class="search-input" placeholder="Search brands, topics, or mentions...">
                        <button class="search-btn" onclick="performGlobalSearch()">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div class="header-right">
                    <!-- Notifications -->
                    <button class="icon-btn" id="notificationBtn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>

                    <!-- Quick Actions -->
                    <button class="icon-btn" id="quickActionsBtn">
                        <i class="fas fa-bolt"></i>
                    </button>

                    <!-- User Menu -->
                    <button class="icon-btn" id="userMenuBtn">
                        <div class="user-avatar-small">TP</div>
                    </button>
                </div>
            </header>

            <!-- Page Content Container -->
            <div class="page-content" id="pageContent">
                <!-- Dynamic content will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modalContainer" class="modal-container"></div>    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/notifications.js"></script>

    <script src="js/mock-data.js"></script>
    <script src="js/api-data.js"></script>

    <!-- Page Modules -->
    <script src="js/dashboard.js?v=20260122"></script>
    <script src="js/realtime.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/competitors.js"></script>
    <script src="js/influencers.js"></script>
    <script src="js/journey.js"></script>
    <script src="js/trends.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/settings.js"></script>

    <!-- Main App -->
    <script src="js/app.js"></script>

</body>
</html>
